services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelguard_pw}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinelguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sentinelguard-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/data/uploads
      - ./data/faiss_index:/app/data/faiss_index
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sentinelguard-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

volumes:
  pgdata:
